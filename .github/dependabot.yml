version: 2
# Dependency updates come once a month, grouped. Every PR runs the whole CI,
# and with strict branch protection each merge to main makes Dependabot rebase
# (and re-run) every other open PR, so a handful of grouped PRs cost far less
# than one per package. Security updates are not on this schedule: they open
# as soon as an advisory lands.
updates:
  # The app and the browser extension share one PR for minor and patch updates
  # and one for majors. A group regenerates each lockfile coherently, so
  # merging one never invalidates the other.
  - package-ecosystem: 'npm'
    directories: ['/', '/extension']
    schedule:
      interval: 'monthly'
    target-branch: 'main'
    # Skip releases replaced within days of shipping.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Majors that are migrations, not bumps; do them as planned work.
    # Tailwind 4 replaces the config-file setup; TypeScript 7 is the native
    # compiler, and the app's Next build and tooling need trying against it
    # (the extension is already on 7).
    ignore:
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        update-types: ['minor', 'patch']
      npm-major:
        update-types: ['major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    target-branch: 'main'
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: 'gradle'
    directory: '/apps/android'
    schedule:
      interval: 'monthly'
    target-branch: 'main'
    groups:
      android-libraries:
        patterns: ['*']

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'monthly'
    target-branch: 'main'
    groups:
      docker-images:
        patterns: ['*']
