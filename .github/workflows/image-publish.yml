name: Publish container image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release version to recover, for example 2.1.3'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  prepare:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      image: ${{ steps.plan.outputs.image }}
      version: ${{ steps.plan.outputs.version }}
      package_version: ${{ steps.plan.outputs.package_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve the immutable source revision
        id: plan
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: node .github/scripts/image-plan.mjs

  publish:
    timeout-minutes: 40
    needs: prepare
    runs-on: ubuntu-latest
    # Release Please and manual recovery for one commit share an idempotent job.
    # A retry reuses the immutable image instead of rebuilding it.
    concurrency:
      group: publish-container-${{ needs.prepare.outputs.sha }}
      cancel-in-progress: false
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: image-source
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse an image already built for this commit
        id: existing
        run: |
          if docker buildx imagetools inspect "$IMAGE:sha-$SOURCE_SHA" --raw > /tmp/existing-image.json 2>/tmp/image-inspect.err; then
            test "$(jq -r '.annotations["org.opencontainers.image.revision"]' /tmp/existing-image.json)" = "$SOURCE_SHA"
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif grep -Eqi 'manifest unknown|not found|404' /tmp/image-inspect.err; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/image-inspect.err >&2
            exit 1
          fi
      - name: Build and publish the release commit once
        if: steps.existing.outputs.found != 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./image-source
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.title=ADHX
            org.opencontainers.image.version=${{ needs.prepare.outputs.package_version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}#run-your-own
          annotations: index:org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          build-args: SENTRY_RELEASE=${{ env.SOURCE_SHA }}
          cache-from: type=gha,scope=adhx-main
          cache-to: type=gha,scope=adhx-main,mode=max
          provenance: mode=max
          sbom: true
      - name: Read the published digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:sha-$SOURCE_SHA" | awk '$1 == "Digest:" {print $2; exit}')
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Attest the newly built image
        if: steps.existing.outputs.found != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
      - name: Promote tags without rebuilding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          LATEST_RELEASE=''
          if [ -n "$VERSION" ]; then
            LATEST_RELEASE=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          fi
          export LATEST_RELEASE
          node --input-type=module <<'JS' > /tmp/image-tags.txt
          import { imagePlan } from './.github/scripts/image-plan.mjs'
          const p = imagePlan({ sha: process.env.SOURCE_SHA, repository: process.env.GITHUB_REPOSITORY,
            version: process.env.VERSION, latestRelease: process.env.LATEST_RELEASE })
          console.log(p.tags.slice(1).join('\n'))
          JS
          TAG_ARGS=()
          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            # Numbered releases are immutable; retrying cannot replace a release.
            if [ -n "$VERSION" ] && [ "$TAG" = "$IMAGE:$VERSION" ]; then
              if docker buildx imagetools inspect "$TAG" > /tmp/release-image.txt 2>/tmp/release-image.err; then
                OLD_DIGEST=$(awk '$1 == "Digest:" {print $2; exit}' /tmp/release-image.txt)
                [ "$OLD_DIGEST" = "$DIGEST" ] || { echo '::error::Release tag already points to a different digest'; exit 1; }
              elif ! grep -Eqi 'manifest unknown|not found|404' /tmp/release-image.err; then
                cat /tmp/release-image.err >&2
                exit 1
              fi
            fi
            TAG_ARGS+=(--tag "$TAG")
          done < /tmp/image-tags.txt
          if [ "${#TAG_ARGS[@]}" -gt 0 ]; then
            docker buildx imagetools create "${TAG_ARGS[@]}" "$IMAGE@$DIGEST"
          fi
      - name: Verify anonymous pulls
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          docker logout ghcr.io
          docker manifest inspect "$IMAGE@$DIGEST" >/dev/null
          {
            echo '## Container image published'
            echo "- Commit: $SOURCE_SHA"
            echo "- Image: $IMAGE@$DIGEST"
            echo '- Platforms: linux/amd64, linux/arm64'
            cat /tmp/image-tags.txt
          } >> "$GITHUB_STEP_SUMMARY"
