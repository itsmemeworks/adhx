name: iOS TestFlight

# Archives the iPhone app (ADHX Share and its Share Extension) for a published
# release, signs it for the App Store and uploads it to TestFlight, so friends
# can install it from the TestFlight app. Release Please calls this after it
# creates a release; run it by hand to upload an existing release again.
#
# Secrets (Settings → Secrets and variables → Actions), set up as in
# docs/releasing.md → iPhone app on TestFlight:
#   APPSTORE_CONNECT_API_KEY_ID      the App Store Connect API key's Key ID
#   APPSTORE_CONNECT_ISSUER_ID       the Issuer ID shown above the keys list
#   APPSTORE_CONNECT_API_KEY_P8      the AuthKey_<id>.p8, base64-encoded (or pasted as is)
#   IOS_DIST_CERT_P12_BASE64         an Apple Distribution certificate + key, as .p12, base64-encoded
#   IOS_DIST_CERT_PASSWORD           that .p12's password
#   IOS_TEAM_ID                      the 10-character Team ID
#   IOS_BUNDLE_PREFIX                the app's bundle id (the extension is <prefix>.ShareExtension)
# No provisioning profiles: automatic signing with the API key makes them.
# Without these secrets the job skips with a notice instead of failing the release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release version, for example 2.3.0'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  testflight:
    # Uploads must be built with a current iOS SDK; the newest stable Xcode on
    # this image is selected below.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version and the signing secrets
        id: plan
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.APPSTORE_CONNECT_API_KEY_P8 }}
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          BUNDLE_PREFIX: ${{ secrets.IOS_BUNDLE_PREFIX }}
          # Repo-wide and always increasing, whether Release Please or a person
          # started the run (a called workflow sees its caller's run_number).
          BUILD_NUMBER: ${{ github.run_id }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 2.3.0, got '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          missing=()
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 CERT_P12 CERT_PASSWORD TEAM_ID BUNDLE_PREFIX; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::notice::No TestFlight upload for v$VERSION: the iOS signing secrets aren't all set (see docs/releasing.md → iPhone app on TestFlight)."
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::IOS_TEAM_ID must be the 10-character Team ID"
            exit 1
          fi
          if ! [[ "$BUNDLE_PREFIX" =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]]; then
            echo "::error::IOS_BUNDLE_PREFIX must be a reverse-DNS bundle id like com.example.adhxshare"
            exit 1
          fi
          echo "upload=true" >> "$GITHUB_OUTPUT"

      # Full history and tags: Config/stamp-version.sh runs `git describe` so
      # Settings shows the release ("2.3.0") on the tag itself.
      - uses: actions/checkout@v7
        if: steps.plan.outputs.upload == 'true'
        with:
          ref: v${{ steps.plan.outputs.version }}
          fetch-depth: 0

      - name: Use the newest stable Xcode
        if: steps.plan.outputs.upload == 'true'
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode_*.app | grep -E '/Xcode_[0-9]+(\.[0-9]+)*\.app$' | sort -V | tail -n 1)
          sudo xcode-select --switch "$xcode/Contents/Developer"
          xcodebuild -version
          echo "Built with $(xcodebuild -version | head -n 1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Install the signing certificate and API key
        if: steps.plan.outputs.upload == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.APPSTORE_CONNECT_API_KEY_P8 }}
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          secrets_dir="$RUNNER_TEMP/ios-signing"
          mkdir -p "$secrets_dir"

          # The API key: xcodebuild reads it from a file. Base64 or the .p8 text both work.
          key_path="$secrets_dir/AuthKey_${ASC_KEY_ID}.p8"
          if [[ "$ASC_KEY_P8" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$ASC_KEY_P8" > "$key_path"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key_path"
          fi
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

          # A throwaway keychain holding only the Apple Distribution identity.
          keychain="$secrets_dir/adhx-signing.keychain-db"
          keychain_password=$(uuidgen)
          printf '%s' "$CERT_P12" | base64 --decode > "$secrets_dir/dist.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$secrets_dir/dist.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          rm -f "$secrets_dir/dist.p12"
          # Search it first, keeping the login keychain (where Xcode keeps any
          # development certificate it makes) after it.
          existing=$(security list-keychains -d user | tr -d '"')
          # shellcheck disable=SC2086 # one path per word
          security list-keychains -d user -s "$keychain" $existing
          security find-identity -v -p codesigning "$keychain" | grep -q "Apple Distribution" || {
            echo "::error::IOS_DIST_CERT_P12_BASE64 holds no Apple Distribution identity"
            exit 1
          }
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Archive the app and its Share Extension
        if: steps.plan.outputs.upload == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          BUNDLE_PREFIX: ${{ secrets.IOS_BUNDLE_PREFIX }}
        run: |
          set -euo pipefail
          # Settings on the command line, so no tracked file changes and
          # stamp-version.sh still reads a clean tag. MARKETING_VERSION and
          # CURRENT_PROJECT_VERSION become CFBundleShortVersionString and
          # CFBundleVersion in both targets' generated Info.plists.
          xcodebuild archive \
            -project apps/ios/ADHXShare.xcodeproj \
            -scheme "ADHX Share" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ADHXShare.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/adhx-ios" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            ADHX_BUNDLE_PREFIX="$BUNDLE_PREFIX" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ steps.plan.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.plan.outputs.build }}"

      - name: Check what was archived
        if: steps.plan.outputs.upload == 'true'
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/ADHXShare.xcarchive/Products/Applications/ADHX Share.app"
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$2"; }
          for info in "$app/Info.plist" "$app/PlugIns/"*.appex/Info.plist; do
            echo "$(plist CFBundleIdentifier "$info") $(plist CFBundleShortVersionString "$info") ($(plist CFBundleVersion "$info"))"
            [[ "$(plist CFBundleShortVersionString "$info")" == "${{ steps.plan.outputs.version }}" ]]
            [[ "$(plist CFBundleVersion "$info")" == "${{ steps.plan.outputs.build }}" ]]
          done
          shown=$(cat "$app/build-info.txt")
          echo "Settings will show: ADHX Share $shown"
          [[ "$shown" == "${{ steps.plan.outputs.version }}" ]] || echo "::warning::build-info.txt says '$shown', not the release"

      - name: Export for App Store Connect and upload to TestFlight
        if: steps.plan.outputs.upload == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$options"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ADHXShare.xcarchive" \
            -exportOptionsPlist "$options" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          {
            echo "Uploaded ADHX Share ${{ steps.plan.outputs.version }} (${{ steps.plan.outputs.build }}) to App Store Connect."
            echo "It shows in TestFlight once Apple finishes processing it (usually a few minutes)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the signing keychain and key
        if: always() && steps.plan.outputs.upload == 'true'
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then security delete-keychain "$SIGNING_KEYCHAIN" || true; fi
          rm -rf "$RUNNER_TEMP/ios-signing"
