name: CI

on:
  pull_request:
    branches: [main]
  # Manual trigger for debugging or special cases
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to run CI on'
        required: false
        type: string
      check_models:
        description: 'Run full pinned text/image/video CPU inference on both Linux architectures'
        required: false
        default: false
        type: boolean
  # Trigger when Release Please workflow completes (to run CI on release PRs)
  # This works because workflow_run events ARE triggered even when the
  # original workflow used GITHUB_TOKEN
  workflow_run:
    workflows: ['Release Please']
    types: [completed]

# Only the trusted metadata-check job may write checks.
permissions:
  contents: read

jobs:
  release-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: .github/release-please/pnpm-lock.yaml
      - name: Install the pinned release compatibility tools
        run: pnpm --dir .github/release-please install --frozen-lockfile --ignore-scripts
      - name: Round-trip real upstream release PRs and tags without GitHub writes
        run: pnpm --dir .github/release-please test

  # GITHUB_TOKEN-created release PRs do not need another full app CI run.
  # Validate their actual diff before reporting the required branch checks.
  release-pr-check:
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: write
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/github-script@v9
        with:
          script: |
            await require('./.github/scripts/check-release-pr.cjs')({ github, context, core })

  # Both native runner-image builds already compile the production app.
  # Keep the required `build` context without compiling it a third time.
  build:
    needs: container-smoke
    runs-on: ubuntu-latest
    if: |
      always() && github.event_name != 'workflow_run' &&
      !(github.event.pull_request.user.login == 'github-actions[bot]' &&
        github.head_ref == 'release-please--branches--main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Require both native image builds and smoke tests
        env:
          RESULT: ${{ needs.container-smoke.result }}
        run: test "$RESULT" = success

  extension:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_run' &&
      !(github.event.pull_request.user.login == 'github-actions[bot]' &&
        github.head_ref == 'release-please--branches--main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v7

      # Version is read from the root "packageManager" field in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install extension dependencies
        run: pnpm --dir extension install --frozen-lockfile

      - name: Type check extension
        run: pnpm --dir extension typecheck

      - name: Build Chromium extension
        run: pnpm --dir extension build:chrome

      - name: Build Firefox extension
        run: pnpm --dir extension build:firefox

      - name: Validate emitted manifests
        run: pnpm --dir extension validate:manifests

  # Native builds exercise the actual installed architecture, including SQLite,
  # FFmpeg, yt-dlp and ONNX bindings. No QEMU inference and no image publishing.
  container-smoke:
    if: |
      github.event_name != 'workflow_run' &&
      !(github.event.pull_request.user.login == 'github-actions[bot]' &&
        github.head_ref == 'release-please--branches--main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      IMAGE_TAG: adhx-ci:${{ github.sha }}-${{ matrix.arch }}
      CHECK_MODELS: ${{ inputs.check_models || contains(github.event.pull_request.labels.*.name, 'validate-models') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Build assembled runner image
        run: |
          docker build \
            --platform linux/${{ matrix.arch }} \
            --target runner \
            --build-arg SENTRY_RELEASE="$GITHUB_SHA" \
            --tag "$IMAGE_TAG" \
            .

      - name: Scan the assembled image for fixable high and critical advisories
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: json
          output: trivy-${{ matrix.arch }}.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          timeout: 15m
      - name: Retain the image vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-security-${{ matrix.arch }}
          path: trivy-${{ matrix.arch }}.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Check native media, auth, migrations and volume persistence
        run: |
          if [ "$CHECK_MODELS" = 'true' ]; then
            bash scripts/container-smoke.sh --models
          else
            bash scripts/container-smoke.sh
          fi

  site-build:
    if: |
      github.event_name != 'workflow_run' &&
      !(github.event.pull_request.user.login == 'github-actions[bot]' &&
        github.head_ref == 'release-please--branches--main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Validation only: Pages publishing remains a separate manual workflow.
      - run: pnpm site:build

  dependency-audit:
    if: |
      github.event_name != 'workflow_run' &&
      !(github.event.pull_request.user.login == 'github-actions[bot]' &&
        github.head_ref == 'release-please--branches--main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install extension dependency metadata
        run: pnpm --dir extension install --frozen-lockfile --ignore-scripts
      - name: Install pinned release-tool metadata
        run: pnpm --dir .github/release-please install --frozen-lockfile --ignore-scripts
      - name: Audit production and build dependencies in all lockfiles
        run: pnpm check:dependencies

  # Dedicated formatting gate. Kept as its own job (rather than a step in `test`)
  # so it surfaces as a distinct required status check on PRs.
  format:
    if: |
      github.event_name != 'workflow_run' &&
      !(github.event.pull_request.user.login == 'github-actions[bot]' &&
        github.head_ref == 'release-please--branches--main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version is read from the "packageManager" field in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (prettier)
        run: pnpm format:check

  test:
    # Skip for release-please PRs (only update version/changelog) and workflow_run events
    if: |
      github.event_name != 'workflow_run' &&
      !(github.event.pull_request.user.login == 'github-actions[bot]' &&
        github.head_ref == 'release-please--branches--main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version is read from the "packageManager" field in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Install maintained media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run tests
        run: pnpm test

      - name: Rehearse large queues, interrupted workers and video recovery
        env:
          ADHX_LOAD_REPORT_PATH: ${{ runner.temp }}/processing-load-report.json
        run: pnpm exec vitest run --config scripts/verify-processing-load.config.ts
      - name: Retain the processing rehearsal report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: processing-load-report
          path: ${{ runner.temp }}/processing-load-report.json
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    if: |
      github.event_name != 'workflow_run' &&
      !(github.event.pull_request.user.login == 'github-actions[bot]' &&
        github.head_ref == 'release-please--branches--main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run browser tests
        env:
          # Same file Next falls back to when workers drop DATABASE_PATH.
          DATABASE_PATH: ${{ github.workspace }}/data/adhdone.db
        run: pnpm test:e2e
