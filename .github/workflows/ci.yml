name: CI

on:
  pull_request:
    branches: [main]
  # Manual trigger for debugging or special cases
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to run CI on'
        required: false
        type: string
      check_models:
        description: 'Run full pinned text/image/video CPU inference on both Linux architectures'
        required: false
        default: false
        type: boolean
  # Trigger when Release Please workflow completes (to run CI on release PRs)
  # This works because workflow_run events ARE triggered even when the
  # original workflow used GITHUB_TOKEN
  workflow_run:
    workflows: ['Release Please']
    types: [completed]

# Only the trusted metadata-check job may write checks.
permissions:
  contents: read

# A new PR revision supersedes its previous checks. Keep manual and trusted
# release-metadata runs separate, including manual runs for different refs.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  release-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'
          cache-dependency-path: .github/release-please/pnpm-lock.yaml
      - name: Install the pinned release compatibility tools
        run: pnpm --dir .github/release-please install --frozen-lockfile --ignore-scripts
      - name: Round-trip real upstream release PRs and tags without GitHub writes
        run: pnpm --dir .github/release-please test

  # GITHUB_TOKEN-created release PRs do not need another full app CI run.
  # Validate their actual diff before reporting the required branch checks.
  release-pr-check:
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: write
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/github-script@v9
        with:
          script: |
            await require('./.github/scripts/check-release-pr.cjs')({ github, context, core })

  # Both native runner-image builds already compile the production app.
  # Keep the required `build` context without compiling it a third time.
  build:
    needs: container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      !cancelled() && github.event_name != 'workflow_run' &&
      !(github.event.pull_request.user.login == 'github-actions[bot]' &&
        github.head_ref == 'release-please--branches--main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Require both native image builds and smoke tests
        env:
          RESULT: ${{ needs.container-smoke.result }}
        run: test "$RESULT" = success

  extension:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'workflow_run' &&
      !(github.event.pull_request.user.login == 'github-actions[bot]' &&
        github.head_ref == 'release-please--branches--main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v7

      # Version is read from the root "packageManager" field in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'
          cache-dependency-path: extension/pnpm-lock.yaml

      - name: Install extension dependencies
        run: pnpm --dir extension install --frozen-lockfile

      - name: Type check extension
        run: pnpm --dir extension typecheck

      - name: Build Chromium extension
        run: pnpm --dir extension build:chrome

      - name: Build Firefox extension
        run: pnpm --dir extension build:firefox

      - name: Validate emitted manifests
        run: pnpm --dir extension validate:manifests

  # Native builds exercise the actual installed architecture, including SQLite,
  # FFmpeg, yt-dlp and ONNX bindings. No QEMU inference and no image publishing.
  container-smoke:
    if: |
      github.event_name != 'workflow_run' &&
      !(github.event.pull_request.user.login == 'github-actions[bot]' &&
        github.head_ref == 'release-please--branches--main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      IMAGE_TAG: adhx-ci:${{ github.sha }}-${{ matrix.arch }}
      CHECK_MODELS: ${{ inputs.check_models || contains(github.event.pull_request.labels.*.name, 'validate-models') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build assembled runner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ env.IMAGE_TAG }}
          # Validation images never ship. Keep this stable so metadata-only PR
          # commits can reuse compiled layers; the image tag still names the SHA.
          build-args: SENTRY_RELEASE=ci
          # PR caches are isolated by GitHub's branch permissions. A new PR can
          # also reuse the trusted multi-platform cache from release builds.
          cache-from: |
            type=gha,scope=adhx-ci-${{ matrix.arch }}
            type=gha,scope=adhx-main
          cache-to: type=gha,scope=adhx-ci-${{ matrix.arch }},mode=max,timeout=2m,ignore-error=true

      - name: Scan the assembled image for fixable high and critical advisories
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          version: v0.76.0
          format: json
          output: trivy-${{ matrix.arch }}.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          timeout: 15m
      - name: Show image findings in the job log
        if: always()
        run: node scripts/security/summarize-image.mjs trivy-${{ matrix.arch }}.json
      - name: Retain the image vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-security-${{ matrix.arch }}
          path: trivy-${{ matrix.arch }}.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Check native media, auth, migrations and volume persistence
        run: |
          if [ "$CHECK_MODELS" = 'true' ]; then
            bash scripts/container-smoke.sh --models
          else
            bash scripts/container-smoke.sh
          fi

  site-build:
    if: |
      github.event_name != 'workflow_run' &&
      !(github.event.pull_request.user.login == 'github-actions[bot]' &&
        github.head_ref == 'release-please--branches--main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'
      - name: Restore the website compiler cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: site/.next/cache
          key: site-next-${{ runner.os }}-${{ runner.arch }}-node26-${{ hashFiles('pnpm-lock.yaml', 'site/next.config.*') }}-${{ github.sha }}
          restore-keys: |
            site-next-${{ runner.os }}-${{ runner.arch }}-node26-${{ hashFiles('pnpm-lock.yaml', 'site/next.config.*') }}-
      - run: pnpm install --frozen-lockfile
      # Validation only: Pages publishing remains a separate manual workflow.
      - run: pnpm site:build

  dependency-audit:
    if: |
      github.event_name != 'workflow_run' &&
      !(github.event.pull_request.user.login == 'github-actions[bot]' &&
        github.head_ref == 'release-please--branches--main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Install extension dependency metadata
        run: pnpm --dir extension install --frozen-lockfile --ignore-scripts
      - name: Install pinned release-tool metadata
        run: pnpm --dir .github/release-please install --frozen-lockfile --ignore-scripts
      - name: Audit production and build dependencies in all lockfiles
        run: pnpm check:dependencies

  # Dedicated formatting gate. Kept as its own job (rather than a step in `test`)
  # so it surfaces as a distinct required status check on PRs.
  format:
    if: |
      github.event_name != 'workflow_run' &&
      !(github.event.pull_request.user.login == 'github-actions[bot]' &&
        github.head_ref == 'release-please--branches--main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version is read from the "packageManager" field in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (prettier)
        run: pnpm format:check

  test:
    # Skip for release-please PRs (only update version/changelog) and workflow_run events
    if: |
      github.event_name != 'workflow_run' &&
      !(github.event.pull_request.user.login == 'github-actions[bot]' &&
        github.head_ref == 'release-please--branches--main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      # Version is read from the "packageManager" field in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Identify the runner package cache
        id: apt-cache
        run: |
          . /etc/os-release
          echo "os=$ID-$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore downloaded media packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/adhx/apt/archives/*.deb
          key: media-apt-${{ steps.apt-cache.outputs.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/install-media-tools.sh') }}-${{ steps.apt-cache.outputs.week }}
          restore-keys: |
            media-apt-${{ steps.apt-cache.outputs.os }}-${{ runner.arch }}-${{ hashFiles('scripts/ci/install-media-tools.sh') }}-
      - name: Install maintained media tools
        timeout-minutes: 8
        run: bash scripts/ci/install-media-tools.sh

      - name: Run tests
        run: pnpm test

      - name: Rehearse large queues, interrupted workers and video recovery
        env:
          ADHX_LOAD_REPORT_PATH: ${{ runner.temp }}/processing-load-report.json
        run: pnpm exec vitest run --config scripts/verify-processing-load.config.ts
      - name: Retain the processing rehearsal report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: processing-load-report
          path: ${{ runner.temp }}/processing-load-report.json
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    if: |
      github.event_name != 'workflow_run' &&
      !(github.event.pull_request.user.login == 'github-actions[bot]' &&
        github.head_ref == 'release-please--branches--main' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        timeout-minutes: 8
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run browser tests
        env:
          # Same file Next falls back to when workers drop DATABASE_PATH.
          DATABASE_PATH: ${{ github.workspace }}/data/adhdone.db
        run: pnpm test:e2e
