name: Install recipes

# The one-command installer and the one-click templates in deploy/, checked on
# a fresh Ubuntu runner the way a new server would run them. Only runs when
# they change.
on:
  pull_request:
    branches: [main]
    paths:
      - 'deploy/install.sh'
      - 'deploy/cloud-init.yaml'
      - 'deploy/one-click/**'
      - 'deploy/vps/**'
      - 'deploy/portainer/**'
      - 'deploy/caprover/**'
      - 'deploy/zeabur/**'
      - 'render.yaml'
      - 'scripts/check-install-templates.rb'
      - '.github/workflows/install-recipes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-recipes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Serve the branch's recipes instead of main's.
      ADHX_SOURCE: file://${{ github.workspace }}/deploy
      # The image is built from this branch below; don't pull the release.
      ADHX_SKIP_PULL: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Check the templates agree with the app
        run: ruby scripts/check-install-templates.rb

      - name: Lint the installer
        run: shellcheck --shell=sh deploy/install.sh

      - name: Check the cloud config
        run: |
          if command -v cloud-init >/dev/null; then
            cloud-init schema --config-file deploy/cloud-init.yaml
          else
            echo 'cloud-init is not on this runner; the template check above covers its shape.'
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build this branch's image under the published name
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          load: true
          push: false
          tags: ghcr.io/itsmemeworks/adhx:latest
          build-args: SENTRY_RELEASE=ci
          cache-from: |
            type=gha,scope=adhx-ci-amd64
            type=gha,scope=adhx-main

      - name: Install with no domain, from the settings cloud-init writes
        run: |
          sudo mkdir -p /opt/adhx
          printf 'ADHX_DOMAIN=\nSETUP_CODE=\n' | sudo tee /opt/adhx/.env >/dev/null
          sudo --preserve-env=ADHX_SOURCE,ADHX_SKIP_PULL sh deploy/install.sh | tee install.log
          grep -q 'ADHX is running.' install.log
          curl -fsS http://127.0.0.1:3000/api/health
          code=$(sudo sed -n 's/^Setup code: //p' /opt/adhx/setup.txt)
          test -n "$code"
          sudo grep -q "^SETUP_CODE=$code\$" /opt/adhx/.env
          cookie=$(cd /opt/adhx && sudo docker compose exec -T adhx node scripts/fresh-install-check.mjs claim "$code")
          echo "::add-mask::$cookie"
          echo "OWNER_COOKIE=$cookie" >> "$GITHUB_ENV"

      - name: Add a domain and update; the owner and their data stay
        run: |
          sudo --preserve-env=ADHX_SOURCE,ADHX_SKIP_PULL ADHX_DOMAIN=localhost sh deploy/install.sh | tee update.log
          grep -q 'ADHX is up to date at https://localhost' update.log
          test ! -e /opt/adhx/setup.txt
          sudo grep -q '^ADHX_DOMAIN=localhost$' /opt/adhx/.env
          cd /opt/adhx
          sudo docker compose exec -T adhx node scripts/fresh-install-check.mjs signed-in "$OWNER_COOKIE"
          # Caddy serves localhost from its own authority, hence -k.
          curl -fsSk --retry 10 --retry-delay 3 --retry-all-errors https://localhost/api/health
          if curl -fsS --max-time 5 http://127.0.0.1:3000/api/health; then
            echo 'Port 3000 should be closed once Caddy is in front' >&2
            exit 1
          fi

      - name: Show the logs
        if: failure()
        run: cd /opt/adhx && sudo docker compose logs --no-color --tail 200
