name: Feature request
description: An idea that would make ADHX better for you and your people.
title: 'feat: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. The best requests start with the problem, not the solution, so we can find the simplest thing that fixes it.

        ADHX is a private feed for small groups of friends. Ideas that add engagement metrics, ads, strangers or streaks will be politely declined. That's the whole point of the thing.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What were you trying to do, and what got in the way?
      placeholder: My mum saves recipes from Instagram, and I can't find them again without scrolling through all of her saves.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
      description: Describe the behaviour you'd like. Sketches welcome; please describe what they show.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
      description: Workarounds you use today, or other approaches you considered.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which part of ADHX?
      multiple: true
      options:
        - New, channels or Right now
        - Search
        - Saving and kept media
        - Phone apps
        - Settings, people and invites
        - Admin
        - Self-hosting and setup
        - Something else
    validations:
      required: true

  - type: checkboxes
    id: help
    attributes:
      label: Would you like to help?
      description: No pressure.
      options:
        - label: I'd like to build this myself.
        - label: I can help test it.
