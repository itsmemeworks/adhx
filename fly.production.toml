# Fly.io configuration for ADHX Production
# See https://fly.io/docs/reference/configuration/

app = 'adhx-prod'
primary_region = 'lhr'

[build]

[env]
  NODE_ENV = 'production'
  DATABASE_PATH = '/data/adhx.db'
  # Understanding pipeline: model weights live on the volume (downloaded once),
  # one inference thread so web requests keep the rest of the CPU.
  SEMANTIC_CACHE_DIR = '/data/models'
  SEMANTIC_THREADS = '1'
  SENTRY_ENVIRONMENT = 'production'
  # OAuth callback host. adhx.com ends in "x.com", which X's logged-out login
  # flow rewrites to "twitter.com" (→ adhtwitter.com), breaking login for users
  # not already signed into X. The Fly host has no "x.com", so X leaves it alone;
  # the callback route then bounces back to adhx.com to set the session cookie.
  # This exact URL must also be registered as a callback in the X Developer Portal.
  TWITTER_OAUTH_REDIRECT_URI = 'https://adhx-prod.fly.dev/api/auth/twitter/callback'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # Health check for application-level monitoring
  # timeout raised from 2s: a burst of public /trending traffic can briefly
  # saturate the single better-sqlite3 event loop, and a too-tight timeout
  # false-positives the probe into restart-looping an otherwise-healthy machine.
  [[http_service.checks]]
    interval = '10s'
    timeout = '5s'
    grace_period = '15s'
    method = 'get'
    path = '/api/health'

# 2GB: the understanding pipeline keeps EmbeddingGemma 2 (text q4 + vision q8,
# ~850MB resident) loaded next to Next.js. Owner-approved 2026-10-16.
[[vm]]
  memory = '4gb'
  cpu_kind = 'performance'
  cpus = 1
  memory_mb = 4096

[mounts]
  source = 'adhx_prod_data'
  destination = '/data'
