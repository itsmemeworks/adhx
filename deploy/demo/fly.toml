# The public ADHX demo on Fly.io (https://demo.adhx.com). See README.md here
# for deploying it. No volume: the world is rebuilt at every start and day.

app = 'adhx-demo'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile'
  ignorefile = 'Dockerfile.dockerignore'

[env]
  NODE_ENV = 'production'
  NEXT_PUBLIC_APP_URL = 'https://demo.adhx.com'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '120s'
    method = 'get'
    path = '/api/health'

# Search by meaning is off in the demo, so no models are loaded.
[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
