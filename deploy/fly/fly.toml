# ADHX on Fly.io from the published image (no build). Fly sets FLY_APP_NAME,
# so the address works itself out; the session secret is made on first start.
#
#   curl -fsSLO https://raw.githubusercontent.com/itsmemeworks/adhx/main/deploy/fly/fly.toml
#   fly launch --copy-config --no-deploy --name your-adhx
#   fly volumes create adhx_data --size 20 --app your-adhx
#   fly deploy --app your-adhx
#   fly logs --app your-adhx | grep setup

primary_region = 'lhr'

[build]
  image = 'ghcr.io/itsmemeworks/adhx:latest'

[env]
  NODE_ENV = 'production'
  DATABASE_PATH = '/data/adhx.db'
  SEMANTIC_CACHE_DIR = '/data/models'
  SEMANTIC_THREADS = '1'

[http_service]
  internal_port = 3000
  force_https = true
  # The download queue, X sync and Right now run inside the app: keep it up.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '90s'
    method = 'get'
    path = '/api/health'

# Search by meaning keeps its models in memory: 2 GB works, 4 GB is comfortable.
[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2

[mounts]
  source = 'adhx_data'
  destination = '/data'
