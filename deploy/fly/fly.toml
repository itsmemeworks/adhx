# ADHX on Fly.io from the published image (no build). Fly sets FLY_APP_NAME,
# so the address works itself out; the session secret is made on first start.
#
#   curl -fsSLO https://raw.githubusercontent.com/itsmemeworks/adhx/main/deploy/fly/fly.toml
#   fly launch --copy-config --no-deploy --name your-adhx
#   fly volumes create adhx_data --size 20 --region lhr --yes --app your-adhx
#   fly deploy --app your-adhx
#   fly logs --app your-adhx --no-tail | grep setup
#
# Use the same region in both places. One volume is right: ADHX is one
# machine with one SQLite file.

primary_region = 'lhr'

# A cushion for the moments a download, a conversion and the models overlap.
swap_size_mb = 1024

[build]
  image = 'ghcr.io/itsmemeworks/adhx:latest'

[env]
  NODE_ENV = 'production'
  DATABASE_PATH = '/data/adhx.db'
  SEMANTIC_CACHE_DIR = '/data/models'
  SEMANTIC_THREADS = '1'

[http_service]
  internal_port = 3000
  force_https = true
  # The download queue, X sync and Right now run inside the app: keep it up.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '60s'
    method = 'get'
    path = '/api/health'

# Search by meaning keeps its models in memory. 2 GB ran out on a new server
# learning its first saves (the web pages stopped answering), so 4 GB.
# A dedicated CPU: on shared CPUs the first downloads, video conversions and
# models used up Fly's burst within minutes, and pages took 0.5-6 s while it
# throttled. One dedicated CPU answered in about 0.1 s.
[[vm]]
  memory = '4gb'
  cpu_kind = 'performance'
  cpus = 1

[mounts]
  source = 'adhx_data'
  destination = '/data'
