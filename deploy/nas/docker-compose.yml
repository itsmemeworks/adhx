# ADHX on a home NAS, open to the internet through Tailscale Funnel.
#
#   cp .env.example .env    # then fill it in (see README.md here)
#   docker compose up -d --build
#
# Two containers share one network: `tailscale` joins your tailnet as the
# device "adhx" and serves https://adhx.<your-tailnet>.ts.net to the whole
# internet (Funnel), passing requests to ADHX on port 3000. ADHX publishes no
# port of its own: the only way in is that address.

services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: adhx
    environment:
      # Only needed the first time; the login is kept in the volume below.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: 'true'
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    # Uncomment to also reach ADHX at http://<nas-address>:3000 on your home network.
    # ports:
    #   - '3000:3000'
    restart: unless-stopped

  # Docker makes a missing data folder as root; ADHX runs as user 1001.
  data-owner:
    image: busybox:1.36
    command: chown 1001:1001 /data
    volumes:
      - ${ADHX_DATA_DIR:-./data}:/data

  adhx:
    build:
      context: ../..
    image: adhx:local
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_started
      data-owner:
        condition: service_completed_successfully
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL in .env}
      # Sign-in links go to the admin page (and the first one to the log),
      # unless you set up email below.
      EMAIL_LINKS_TO_ADMIN: ${EMAIL_LINKS_TO_ADMIN:-1}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      MOMENT_MIN_SAVERS: ${MOMENT_MIN_SAVERS:-2}
      # Refines search results (optional).
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      # X bookmark sync (optional): your own X developer app.
      TWITTER_CLIENT_ID: ${TWITTER_CLIENT_ID:-}
      TWITTER_CLIENT_SECRET: ${TWITTER_CLIENT_SECRET:-}
      # Tailscale is the only way in and sets the visitor's address.
      TRUST_PROXY_IP_HEADERS: 'true'
      # Downloads pause when the disk has less free than this.
      KEEP_MIN_FREE_GB: ${KEEP_MIN_FREE_GB:-20}
      SEMANTIC_THREADS: ${SEMANTIC_THREADS:-2}
    volumes:
      # The database, the search model and every kept picture and video.
      - ${ADHX_DATA_DIR:-./data}:/data
    restart: unless-stopped

volumes:
  tailscale_state:
