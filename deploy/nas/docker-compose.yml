# Vendor-neutral example for an existing Docker reverse proxy.
# No host port and no public tunnel. Set the network, HTTPS URL and data path.
services:
  adhx:
    image: ${ADHX_IMAGE:-ghcr.io/itsmemeworks/adhx:latest}
    restart: unless-stopped
    environment:
      DATABASE_PATH: '/data/adhx.db'
      # Optional: without it ADHX makes one in /data on first start.
      SESSION_SECRET: '${SESSION_SECRET:-}'
      SETUP_CODE: '${SETUP_CODE:-}'
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set the external HTTPS address}
      ALLOWED_EMAILS: '${ALLOWED_EMAILS:-}'
      EMAIL_LINKS_TO_ADMIN: '${EMAIL_LINKS_TO_ADMIN:-1}'
      SMTP_URL: '${SMTP_URL:-}'
      RESEND_API_KEY: '${RESEND_API_KEY:-}'
      EMAIL_FROM: '${EMAIL_FROM:-}'
      ADMIN_USER_IDS: '${ADMIN_USER_IDS:-}'
      ADMIN_USERNAMES: '${ADMIN_USERNAMES:-}'
      MOMENT_MIN_SAVERS: '${MOMENT_MIN_SAVERS:-2}'
      TWITTER_CLIENT_ID: '${TWITTER_CLIENT_ID:-}'
      TWITTER_CLIENT_SECRET: '${TWITTER_CLIENT_SECRET:-}'
      AUTO_SYNC_EVERY_MINUTES: '${AUTO_SYNC_EVERY_MINUTES:-50}'
      SYNC_COOLDOWN_MINUTES: '${SYNC_COOLDOWN_MINUTES:-1}'
      KEEP_MEDIA: '${KEEP_MEDIA:-on}'
      KEEP_BACKFILL: '${KEEP_BACKFILL:-on}'
      KEEP_H264: '${KEEP_H264:-on}'
      KEEP_MIN_FREE_GB: '${KEEP_MIN_FREE_GB:-2}'
      KEEP_MAX_FILESIZE: '${KEEP_MAX_FILESIZE:-4G}'
      KEEP_CONCURRENCY: '${KEEP_CONCURRENCY:-2}'
      YTDLP_COOKIES: '${YTDLP_COOKIES:-}'
      MEDIA_DIR: '${MEDIA_DIR:-/data/media}'
      SEMANTIC_SEARCH: '${SEMANTIC_SEARCH:-on}'
      SEMANTIC_THREADS: '${SEMANTIC_THREADS:-2}'
      SEMANTIC_CACHE_DIR: '${SEMANTIC_CACHE_DIR:-/data/models}'
      SEMANTIC_SPEECH: '${SEMANTIC_SPEECH:-on}'
      SEMANTIC_SCREEN_TEXT: '${SEMANTIC_SCREEN_TEXT:-on}'
      PROCESSING_MODE: '${PROCESSING_MODE:-local}'
      PROCESSING_WORKER_TOKEN: '${PROCESSING_WORKER_TOKEN:-}'
      INDEXING_LEVEL: '${INDEXING_LEVEL:-normal}'
      TYPESAFE_API_KEY: '${TYPESAFE_API_KEY:-}'
      TYPESAFE_CHANNEL_IMAGES: '${TYPESAFE_CHANNEL_IMAGES:-off}'
      TRUST_PROXY_IP_HEADERS: '${TRUST_PROXY_IP_HEADERS:-false}'
      SENTRY_DSN: '${SENTRY_DSN:-}'
    volumes:
      - ${ADHX_DATA_DIR:?Set a private persistent data folder}:/data
    networks:
      proxy:
        aliases:
          - adhx
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(5000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

networks:
  proxy:
    external: true
    name: ${ADHX_PROXY_NETWORK:?Set the Docker network shared with your proxy}
