services:
  adhx:
    image: ${ADHX_IMAGE:-ghcr.io/itsmemeworks/adhx:latest}
    ports:
      - '3000:3000'
    environment:
      # Sign-in links need one way to reach people: Resend, your own mail
      # server (SMTP_URL), or EMAIL_LINKS_TO_ADMIN=1 (you pass links on from
      # the admin page; your own first link is printed in the logs).
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET before starting ADHX}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      TWITTER_CLIENT_ID: ${TWITTER_CLIENT_ID:-}
      TWITTER_CLIENT_SECRET: ${TWITTER_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_LINKS_TO_ADMIN: ${EMAIL_LINKS_TO_ADMIN:-}
      # Only these emails (or @domains) can make an account. Leave empty for open sign-up.
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      # 1 when it's just you; 2 or 3 for a group of friends.
      MOMENT_MIN_SAVERS: ${MOMENT_MIN_SAVERS:-2}
    volumes:
      # The database, the search model and every kept picture and video.
      # Give it room: video adds up (see README → Disk space).
      - adhx_data:/data

volumes:
  adhx_data:
