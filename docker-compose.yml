services:
  adhx:
    image: ${ADHX_IMAGE:-ghcr.io/itsmemeworks/adhx:latest}
    ports:
      - '3000:3000'
    environment:
      # The production image requires email delivery for magic-link sign-in.
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET before starting ADHX}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      TWITTER_CLIENT_ID: ${TWITTER_CLIENT_ID:-}
      TWITTER_CLIENT_SECRET: ${TWITTER_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY for magic-link sign-in}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM to a verified sender}
    volumes:
      - adhx_data:/data

volumes:
  adhx_data:
